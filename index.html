<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b4b46">
  <title>Gateway Health Group Command Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b4b46'/%3E%3Cpath d='M14 43h36M18 39V28h6v11m4 0V19h7v20m4 0V24h7v15' stroke='%23e0ad3a' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --navy: #173b59;
      --teal-950: #073c38;
      --teal-900: #0b4b46;
      --teal-800: #0d5d56;
      --teal-700: #08766c;
      --teal-100: #dff2ef;
      --teal-50: #eff8f6;
      --gold: #d8a539;
      --gold-soft: #fff3d9;
      --ink: #193545;
      --muted: #5c7482;
      --line: #d6e3e5;
      --canvas: #f4f7f7;
      --panel: #ffffff;
      --danger: #bb433c;
      --danger-soft: #fbe9e7;
      --shadow: 0 12px 30px rgba(20, 58, 67, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--canvas);
      font: 16px/1.5 "Segoe UI", Arial, sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button, a, summary, input[type="checkbox"] { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(216, 165, 57, 0.48);
      outline-offset: 2px;
    }

    .app-shell { display: flex; min-height: 100vh; }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      width: 248px;
      display: flex;
      flex-direction: column;
      padding: 22px 14px;
      color: #fff;
      background: linear-gradient(180deg, var(--teal-900), var(--teal-950));
      overflow-y: auto;
      transition: transform 0.2s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 24px;
      background: #fff;
      color: var(--teal-900);
      border-radius: 14px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 1.25rem;
    }

    .brand strong { display: block; font-size: 0.93rem; }
    .brand span { display: block; color: var(--muted); font-size: 0.76rem; }

    .nav-label {
      padding: 0 12px 8px;
      color: #b7d2cf;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .nav-list { display: grid; gap: 6px; margin-bottom: 20px; padding: 0; list-style: none; }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 10px 14px;
      color: #e8f4f2;
      text-decoration: none;
      border-radius: 11px;
      transition: 150ms ease;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }

    .nav-link:hover, .nav-link.active { background: rgba(255, 255, 255, 0.13); }
    .nav-link.active { box-shadow: inset 4px 0 var(--gold); font-weight: 600; }
    .nav-icon { width: 22px; text-align: center; display: inline-block; }

    .privacy-note {
      margin-top: auto;
      padding: 15px;
      color: #d9ece9;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 13px;
      font-size: 0.78rem;
    }
    .privacy-note strong { display: block; margin-bottom: 5px; color: #fff; }

    .main { min-height: 100vh; margin-left: 248px; width: calc(100% - 248px); }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 72px;
      padding: 14px 32px;
      background: rgba(244, 247, 247, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .breadcrumb { color: var(--teal-700); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .saved-status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 0.82rem; }

    .mobile-menu {
      display: none; width: 42px; height: 42px; color: var(--teal-900); background: #fff; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; align-items: center; justify-content: center;
    }

    .content { width: min(1500px, 100%); margin: 0 auto; padding: 30px 32px 58px; }
    .view { display: none; }
    .view.active { display: block; animation: fade-in 180ms ease; }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 7px; color: var(--teal-700); font-size: 0.74rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: clamp(1.75rem, 3vw, 2.45rem); line-height: 1.15; letter-spacing: -0.035em; }
    h2 { margin-bottom: 6px; font-size: 1.25rem; line-height: 1.25; color: var(--teal-950); }
    h3 { margin-bottom: 6px; font-size: 1rem; }
    .subtle { color: var(--muted); }
    .small { font-size: 0.84rem; }

    .head-actions, .button-row { display: flex; flex-wrap: wrap; gap: 10px; }

    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 15px; color: var(--ink); background: #fff; border: 1px solid #c7d8da; border-radius: 10px; font-weight: 700; text-decoration: none; cursor: pointer; transition: all 0.15s ease;
    }
    .button:hover { border-color: var(--teal-700); background-color: var(--teal-50); }
    .button.primary { color: #fff; background: var(--teal-700); border-color: var(--teal-700); }
    .button.primary:hover { background: var(--teal-800); border-color: var(--teal-800); }
    .button.gold { color: #3e321b; background: var(--gold-soft); border-color: #e6c577; }
    .button.gold:hover { background: #feeebf; }
    .button.danger { color: var(--danger); background: var(--danger-soft); border-color: #f0c8c4; }
    .button.danger:hover { background: #fcdbd7; }
    .button.small-button { min-height: 34px; padding: 6px 10px; font-size: 0.88rem; }

    .dashboard-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
    .span-12 { grid-column: span 12; }
    .span-8 { grid-column: span 8; }
    .span-4 { grid-column: span 4; }

    .script-box { border-left: 4px solid var(--teal-700); background: var(--teal-50); padding: 16px; border-radius: 4px var(--radius) var(--radius) 4px; margin-bottom: 16px; }
    .highlight-name { color: var(--teal-900); background: var(--gold-soft); padding: 2px 6px; border-radius: 4px; font-weight: 700; border: 1px dashed #e6c577; }
    
    .accordion-item { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .accordion-header { background: #fafcfc; padding: 14px 18px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .accordion-header:hover { background: var(--teal-50); }
    .accordion-content { padding: 18px; background: #fff; border-top: 1px solid var(--line); }
    .accordion-item.collapsed .accordion-content { display: none; }

    .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .input-group label { font-weight: 700; font-size: 0.88rem; color: var(--teal-950); }
    .text-input { padding: 10px 14px; border: 1px solid #c7d8da; border-radius: 8px; outline: none; transition: border 0.15s ease; width: 100%; margin-bottom: 15px;}
    .text-input:focus { border-color: var(--teal-700); box-shadow: 0 0 0 3px rgba(8, 118, 108, 0.1); }

    .script-question { display: flex; align-items: flex-start; gap: 12px; padding: 12px; background: var(--canvas); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
    .script-question input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--teal-700); }
    
    .timer-container { display: flex; align-items: center; gap: 12px; background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 20px; font-family: monospace; font-size: 1.1rem; }
    .timer-btn-icon { background: transparent; border: none; color: var(--gold); cursor: pointer; padding: 0; display: flex; align-items: center; }
    .timer-btn-icon:hover { color: #fff; }

    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th { padding: 12px 16px; background: var(--teal-50); border-bottom: 2px solid var(--line); color: var(--teal-950); font-weight: 700; font-size: 0.88rem; }
    .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 0.93rem; }
    .data-table tr:hover td { background: #fafcfc; }
    .empty-state { text-align: center; padding: 32px; color: var(--muted); }

    @media (max-width: 1024px) { .span-8, .span-4 { grid-column: span 12; } }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; width: 100%; }
      .topbar { padding: 14px 16px; }
      .mobile-menu { display: flex; }
      .content { padding: 20px 16px; }
      .page-head { flex-direction: column; align-items: stretch; gap: 14px; }
